<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Free Giveaway</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111;
      text-align: center;
    }

    .header {
      padding: 18px 10px;
      border-bottom: 1px solid #ddd;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 35px 18px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 19px;
      color: #555;
      margin-bottom: 25px;
    }

    .offer-image {
      width: 100%;
      max-width: 650px;
      border-radius: 8px;
      display: block;
      margin: 0 auto 30px;
    }

    .register-btn {
      display: block;
      width: 100%;
      padding: 20px 15px;
      border-radius: 50px;
      background: linear-gradient(90deg, #ff8a00, #ff0066);
      color: white;
      text-decoration: none;
      font-size: 26px;
      font-weight: bold;
      margin: 20px auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .register-btn:active {
      transform: scale(0.98);
    }

    .notice {
      margin-top: 30px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      background: #f5f5f5;
      border-radius: 10px;
    }

    .footer {
      margin-top: 45px;
      padding: 20px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="header">
    🎁 FREE GIVEAWAY
  </div>

  <div class="container">

    <h1>Get Your Free Giveaway!</h1>

    <div class="subtitle">
      Click the button below to continue.
    </div>

    <!-- নিজের image URL এখানে বসাবে -->
    <img
      class="offer-image"
      src="https://via.placeholder.com/650x400?text=Your+Offer"
      alt="Giveaway"
    >

    <!-- CPA BUILD CONTENT LOCKER LINK -->
    <a
      class="register-btn"
      href="http://your-deployment-url.com/08a2fe7"
      target="_blank"
      rel="noopener noreferrer"
    >
      REGISTER NOW
    </a>

    <div class="notice">
      Complete the required steps on the next page to continue.
    </div>

  </div>

  <div class="footer">
    © 2026 Giveaway
  </div>

</body>
</html>
