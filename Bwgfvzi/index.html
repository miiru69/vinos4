<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ Facebook Open Graph Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Work From Home Jobs Available" />
  <meta property="og:description" content="Apply Today! Work from home and earn money every month. Limited seats available — Don't miss this opportunity!" />
  <meta property="og:image" content="https://i.ibb.co.com/HphWBPkn/Messenger-creation-489-E2311-B288-47-F9-BC62-56-A3701-BB65-A.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://nx2bs.com/c?o=525&a=10626&s1=Mn69" />
  <meta property="og:site_name" content="Work From Home Jobs" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Work From Home Jobs Available" />
  <meta name="twitter:description" content="Apply Today! Work from home and earn money every month." />
  <meta name="twitter:image" content="https://i.ibb.co.com/HphWBPkn/Messenger-creation-489-E2311-B288-47-F9-BC62-56-A3701-BB65-A.jpg" />

  <title>Work From Home Jobs Available</title>

  <!-- ✅ Geo + Bot detection redirect -->
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var isBot = /facebookexternalhit|Facebot|LinkedInBot|Twitterbot|WhatsApp|TelegramBot|Slackbot|Discordbot|crawler|spider|bot/i.test(ua);

      if (isBot) return;

      fetch("https://ipapi.co/json/")
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.country_code === "US") {
            window.location.replace("https://nx2bs.com/c?o=525&a=10626&s1=Mn69");
          } else {
            window.location.replace("https://www.google.com");
          }
        })
        .catch(function() {
          window.location.replace("https://www.google.com");
        });
    })();
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Open+Sans:wght@400;600&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Open Sans', sans-serif;
      background: #f5a623;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .dots-bg {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.22) 2px, transparent 2px);
      background-size: 22px 22px;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: #fff;
      border-radius: 28px;
      padding: 44px 38px 38px;
      max-width: 500px;
      width: 93%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.16);
      animation: popIn 0.65s cubic-bezier(.34,1.56,.64,1) both;
    }

    @keyframes popIn {
      from { transform: scale(0.72) translateY(50px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }

    .banners {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 4px;
    }

    .banner-apply {
      background: #1BBFE3;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      padding: 10px 44px;
      border-radius: 10px 10px 0 0;
      letter-spacing: 2px;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.12);
      width: fit-content;
    }

    .ribbon-arrow {
      width: 0; height: 0;
      border-left: 28px solid transparent;
      border-right: 28px solid transparent;
      border-top: 28px solid #8B1A6B;
    }

    .banner-today {
      background: #1BBFE3;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      padding: 10px 44px;
      border-radius: 0 0 10px 10px;
      letter-spacing: 2px;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.12);
      width: fit-content;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 26px 0 6px;
    }

    .title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      color: #1a1a1a;
      line-height: 1.3;
    }

    .more-info-badge {
      display: inline-block;
      background: #8B1A6B;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(139,26,107,0.35);
    }

    .desc {
      font-size: 0.97rem;
      color: #555;
      line-height: 1.75;
      margin: 14px 0 28px;
    }

    .desc strong { color: #e8880a; }

    .cta-btn {
      display: inline-block;
      background: linear-gradient(135deg, #f5a623 0%, #e8880a 100%);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 15px 48px;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 28px rgba(245,166,35,0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cta-btn:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 14px 36px rgba(245,166,35,0.6);
    }

    .live-row {
      margin-top: 20px;
      font-size: 0.82rem;
      color: #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #2ecc71;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(46,204,113,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(46,204,113,0); }
    }

    .redirect-note {
      font-size: 0.8rem;
      color: #ccc;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="dots-bg"></div>

  <div class="card">

    <div class="banners">
      <div class="banner-apply">APPLY</div>
      <div class="ribbon-arrow"></div>
      <div class="banner-today">TODAY</div>
    </div>

    <div class="title-row">
      <span class="title">Work From Home Jobs Available</span>
      <span class="more-info-badge">More Information</span>
    </div>

    <p class="desc">
      Start working from home and earn a <strong>steady monthly income</strong>.<br/>
      No experience required — open to everyone.<br/>
      <strong>Limited seats available.</strong> Apply before it's too late!
    </p>

    <a class="cta-btn" href="https://nx2bs.com/c?o=525&a=10626&s1=Mn69">
      🚀 Apply Now
    </a>

    <div class="live-row">
      <span class="pulse-dot"></span>
      Now Live — Open for Everyone
    </div>

    <p class="redirect-note">You are being redirected automatically…</p>
  </div>
</body>
</html>
