<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 25px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .gift {
            font-size: 75px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 38px;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .offer {
            background: #f5f3ff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .offer h2 {
            color: #5b3cc4;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .offer p {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
        }

        .register-btn {
            width: 100%;
            border: none;
            outline: none;
            padding: 18px 25px;
            border-radius: 50px;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: white;
            font-size: 21px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 65, 108, 0.35);
            transition: all 0.25s ease;
        }

        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 65, 108, 0.45);
        }

        .register-btn:active {
            transform: scale(0.98);
        }

        .note {
            margin-top: 18px;
            font-size: 13px;
            color: #888;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 32px;
            }

            .gift {
                font-size: 60px;
            }

            .register-btn {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="gift">🎁</div>

        <h1>Free Giveaway</h1>

        <p class="subtitle">
            You have a chance to claim an exclusive giveaway.
            Register now to continue.
        </p>

        <div class="offer">
            <h2>🎉 Special Offer</h2>
            <p>
                Click the button below to continue with your registration
                and check the available offer.
            </p>
        </div>

        <!-- REGISTER BUTTON -->
        <button
            type="button"
            class="register-btn"
            onclick="_VR()">
            REGISTER NOW
        </button>

        <p class="note">
            By continuing, you agree to follow the registration instructions
            shown after clicking the button.
        </p>

    </div>

</body>
</html>
